title = "PayFlex gitleaks configuration"

[extend]
useDefault = true   # all built-in rules (AWS, GitHub tokens, private keys, Stripe...)

[[rules]]
id = "credit-card-number"
description = "Possible credit card number (PII)"
regex = '''\b(?:4[0-9]{3}|5[1-5][0-9]{2}|3[47][0-9]{2}|6011)[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{3,4}\b'''
tags = ["pii", "card"]

[[rules]]
id = "payflex-api-key"
description = "PayFlex API / secret key hard-coded"
regex = '''PAYFLEX_(?:API|SECRET)_KEY\s*[=:]\s*['"]?[A-Za-z0-9_\-]{16,}['"]?'''
tags = ["secret", "payflex"]

[allowlist]
description = "Generated / third-party files and this config itself"
paths = [
  '''node_modules/''',
  '''coverage/''',
  '''package-lock\.json''',
  '''\.gitleaks\.toml''',
]
